<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - FundHope</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">FundHope Admin</div>

    <nav>
        <a href="admin.html">Dashboard</a>
        <a href="campaigns.html">Campaigns</a>
        <button onclick="logout()" class="logout-btn">Logout</button>
    </nav>
</header>

<section class="dashboard">

    <h1>Admin Dashboard</h1>

    <p class="dashboard-subtitle">
        Manage users, campaigns and donations.
    </p>

    <div class="dashboard-grid">

        <div class="dashboard-card">
            <h3>Total Users</h3>
            <p id="totalUsers">0</p>
        </div>

        <div class="dashboard-card">
            <h3>Total Campaigns</h3>
            <p id="totalCampaigns">0</p>
        </div>

        <div class="dashboard-card">
            <h3>Total Donations</h3>
            <p id="totalDonations">0</p>
        </div>

    </div>

    <h2 class="section-title">Manage Campaigns</h2>

    <div id="adminCampaignList" class="campaign-grid"></div>

</section>

<script src="javascript.js"></script>
</body>
</html>
