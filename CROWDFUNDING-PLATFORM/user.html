<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - FundHope</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">FundHope</div>

    <nav>
        <a href="user.html">Dashboard</a>
        <a href="campaigns.html">Campaigns</a>
        <a href="create-campaign.html">Create Campaign</a>
        <button onclick="logout()" class="logout-btn">Logout</button>
    </nav>
</header>

<section class="dashboard">

    <h1>Welcome, <span id="userName">User</span> 👋</h1>

    <p class="dashboard-subtitle">
        Manage your campaigns and support meaningful causes.
    </p>

    <div class="dashboard-grid">

        <div class="dashboard-card">
            <h3>Total Campaigns</h3>
            <p id="userCampaignCount">0</p>
        </div>

        <div class="dashboard-card">
            <h3>Total Donations</h3>
            <p id="userDonationCount">0</p>
        </div>

        <div class="dashboard-card">
            <h3>Amount Donated</h3>
            <p>₹<span id="userDonationAmount">0</span></p>
        </div>

    </div>

    <div class="dashboard-actions">

        <a href="campaigns.html" class="btn">
            Explore Campaigns
        </a>

        <a href="create-campaign.html" class="btn">
            Create Campaign
        </a>

    </div>

</section>

<script src="javascript.js"></script>
</body>
</html>
